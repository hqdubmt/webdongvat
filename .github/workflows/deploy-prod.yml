name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/masterlms

jobs:
  # Run tests/checks before deployment
  pre-flight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Type check API
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Install Web dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check web types
        working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit

  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    needs: pre-flight
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: echo "tag=$(date +'%Y%m%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,prefix=prod-,format=short

      - name: Extract metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,prefix=prod-,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual approval gate for production deployment
  approval:
    name: Await Production Approval
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production  # This environment requires manual approval in GitHub settings

    steps:
      - name: Approved
        run: echo "Production deployment approved by ${{ github.event.review.user.login || 'auto' }}"

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: approval
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: echo "tag=$(date +'%Y%m%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.PROD_DEPLOY_PATH || '/opt/masterlms' }}

            # Backup current state
            echo "Creating backup snapshot..."
            docker compose -f infra/docker/docker-compose.yml ps > /tmp/masterlms-backup-state.txt

            # Pull latest code
            git pull origin main

            # Login to registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull production images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.tag }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ steps.version.outputs.tag }}

            # Update image tags in environment
            export API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.tag }}
            export WEB_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ steps.version.outputs.tag }}

            # Rolling restart - API first, then web
            echo "Restarting API service..."
            docker compose -f infra/docker/docker-compose.yml up -d --no-build api

            # Wait for API health check
            echo "Waiting for API to be healthy..."
            timeout 120 bash -c 'until docker compose -f infra/docker/docker-compose.yml exec -T api curl -sf http://localhost:3001/health; do sleep 5; done'

            # Run database migrations
            echo "Running database migrations..."
            docker compose -f infra/docker/docker-compose.yml exec -T api npx prisma migrate deploy

            # Restart web
            echo "Restarting Web service..."
            docker compose -f infra/docker/docker-compose.yml up -d --no-build web

            # Clean up old images
            docker image prune -f

            echo "Production deployment completed: $(date)"
            echo "Version: ${{ steps.version.outputs.tag }}"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: echo "tag=$(date +'%Y%m%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -20)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          release_name: Release v${{ steps.version.outputs.tag }}
          body: |
            ## MasterLMS Production Release

            **Version:** `${{ steps.version.outputs.tag }}`
            **Commit:** `${{ github.sha }}`
            **Deployed at:** `${{ github.event.head_commit.timestamp }}`

            ## Changes
            ${{ steps.changelog.outputs.changes }}

            ## Docker Images
            - API: `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.tag }}`
            - Web: `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ steps.version.outputs.tag }}`
          draft: false
          prerelease: false

  notify:
    name: Notify Production Deployment
    runs-on: ubuntu-latest
    needs: [deploy, create-release]
    if: always()

    steps:
      - name: Notify success
        if: ${{ needs.deploy.result == 'success' }}
        run: |
          echo "PRODUCTION deployment succeeded!"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          # Add Slack/Discord notification here

      - name: Notify failure
        if: ${{ needs.deploy.result == 'failure' }}
        run: |
          echo "PRODUCTION deployment FAILED!"
          echo "Commit: ${{ github.sha }}"
          echo "Check logs immediately!"
          exit 1
