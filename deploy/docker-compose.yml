version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wildlife-postgres
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Admin@123456}
      POSTGRES_DB: ${POSTGRES_DB:-wildlife_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-wildlife_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildlife-network
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: wildlife-redis
    env_file:
      - .env
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-Redis@123456} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Redis@123456}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildlife-network
    deploy:
      resources:
        limits:
          memory: 160m

  minio:
    image: minio/minio:RELEASE.2022-03-17T06-34-49Z
    container_name: wildlife-minio
    env_file:
      - .env
    restart: unless-stopped
    command: server /data --console-address ":9100"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-Minio@123456789}
    ports:
      - "9002:9000"
      - "9100:9100"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - wildlife-network
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    image: hqdu/wildlife-api:latest
    container_name: wildlife-api
    env_file:
      - .env
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-Admin@123456}@postgres:5432/${POSTGRES_DB:-wildlife_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-masterlms-super-secret-key-change-in-production-2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Redis@123456}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-Minio@123456789}
      MINIO_BUCKET: ${MINIO_BUCKET:-species-media}
      MINIO_USE_SSL: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    networks:
      - wildlife-network
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    image: hqdu/wildlife-web:latest
    container_name: wildlife-web
    env_file:
      - .env
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
      API_INTERNAL_URL: http://api:3001
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      JWT_SECRET: ${JWT_SECRET:-masterlms-super-secret-key-change-in-production-2024}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-Minio@123456789}
      MINIO_BUCKET: ${MINIO_BUCKET:-species-media}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wildlife-network
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:alpine
    container_name: wildlife-nginx
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "4000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - wildlife-network
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  wildlife-network:
    driver: bridge
