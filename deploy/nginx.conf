events {}

http {

  upstream api {
    server api:3001;
  }

  upstream web {
    server web:3000;
  }

  upstream minio {
    server minio:9000;
  }

  server {
    listen 80;
    client_max_body_size 50m;

    # Next.js proxy routes — must go to web (add auth headers, custom logic)
    location /api/auth/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ai/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 20m;
    }

    location /api/users {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/samples {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 20m;
    }

    location /api/revalidate {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend Express API (species, etc.)
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Next.js web app
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location /storage/ {
      rewrite ^/storage/(.*) /$1 break;
      proxy_pass http://minio;
    }
  }
}
