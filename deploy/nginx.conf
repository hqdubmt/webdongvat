worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream api {
        server wildlife-api:3001;
    }

    upstream web {
        server wildlife-web:3000;
    }

    upstream minio {
        server wildlife-minio:9000;
    }

    server {
        listen 80;

        client_max_body_size 50m;

        # MinIO storage proxy
        location /storage/ {
            proxy_pass http://minio/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        # Next.js-owned API routes → web container
        location ~ ^/api/(auth/login|auth/logout|auth/me|users|samples|revalidate)(/|$) {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ai/ {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Express API routes → api container
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Pages → web container
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
